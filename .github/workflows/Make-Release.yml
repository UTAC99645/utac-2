name: Make Release By tag
on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      time: ${{ steps.time.outputs.time }}
      version: ${{ steps.time.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: time
        id: time
        run: |
          echo "time=$(date -u)" >> $GITHUB_OUTPUT
          version=$(jq -r .version package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          version: "26"

      - name: Build
        run: |
          pnpm i
          pnpm run build

      - name: Compress
        working-directory: dist
        run: |
          tar cf dist.tar *
          lz4 -0 -k dist.tar dist.tar.lz4
          zstd -10 -k dist.tar -o dist.tar.zst
          xz -19e -k dist.tar
          rm -rf assets index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  Upload:
    runs-on: ubuntu-latest
    needs: Build
    env:
      version: ${{ needs.Build.outputs.version }}
      time: ${{ needs.Build.outputs.time }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Make Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ env.version }}
          name: New Version
          body: New Version Make At ${{ env.time }} With Version ${{ env.version }}
          generate_release_notes: true
          files: |
            dist/*
