name: Make Release By Tag

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # 正式发布不要中途掐断

env:
  NODE_VERSION: '24'               # Active LTS
  PNPM_VERSION: '10'
  TAR_SOURCE: '.output'     # SSR 全量部署改成 '.output'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # tag 名走 env 传入，避免直接注入 shell
      - name: 校验 tag 与 package.json 版本一致
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          tag_ver="${TAG#[vV]}"
          if [ "$tag_ver" != "$pkg" ]; then
            echo "::error::tag($TAG) 与 package.json($pkg) 版本不一致，拒绝发布"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Ensure lz4
        run: command -v lz4 || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lz4)

      - name: Package & compress
        run: |
          set -euo pipefail
          mkdir -p dist
          ver='${{ steps.meta.outputs.version }}'
          cd dist
          # 固定 mtime/owner/排序 → 产物可复现
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "dist-${ver}.tar" -C "$GITHUB_WORKSPACE/$TAR_SOURCE" .
          lz4  -12 -q -k "dist-${ver}.tar" "dist-${ver}.tar.lz4" & p1=$!
          zstd -T0 -19 -q -k "dist-${ver}.tar" -o "dist-${ver}.tar.zst" & p2=$!
          xz   -T0 -9e -q -k "dist-${ver}.tar" & p3=$!
          wait $p1 && wait $p2 && wait $p3
          sha256sum dist-* > SHA256SUMS.txt

      - name: Size summary
        run: |
          {
            echo "### 📦 ${{ steps.meta.outputs.tag }} 产物大小"
            echo '| 文件 | 大小 |'; echo '| --- | --- |'
            for f in dist/dist-*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}     # 用真实推送的 tag，不再另建
          target_commitish: ${{ github.sha }}
          name: v${{ steps.meta.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            🕐 Build at: ${{ steps.meta.outputs.time }}
            🔗 Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            🏗️ Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/*
