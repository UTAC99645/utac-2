name: Make Release By Tag

on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # 正式发布不可中途掐断

env:
  NODE_VERSION: '24'
  TAR_SOURCE: '.output'            # 纯静态部署改成 '.output/public'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: 校验 tag 与 package.json 版本一致
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          tag_ver="${TAG#[vV]}"
          if [ "$tag_ver" != "$pkg" ]; then
            echo "::error::tag($TAG) 与 package.json($pkg) 版本不一致，拒绝发布"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Ensure lz4
        run: command -v lz4 || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lz4)

      - name: Package & compress
        env:
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          # 固定 mtime/owner/排序 → 产物可复现
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf "dist-$VER.tar" -C "$GITHUB_WORKSPACE/$TAR_SOURCE" .
          lz4  -12 -q -k "dist-$VER.tar" "dist-$VER.tar.lz4" & p1=$!
          zstd -T0 -19 -q -k "dist-$VER.tar" -o "dist-$VER.tar.zst" & p2=$!
          xz   -T0 -9e -q -k "dist-$VER.tar" & p3=$!
          wait $p1 && wait $p2 && wait $p3
          sha256sum "dist-$VER".tar* > SHA256SUMS.txt

      - name: Size summary
        run: |
          {
            echo "### 📦 ${{ steps.meta.outputs.tag }} 产物大小"
            echo '| 文件 | 大小 |'; echo '| --- | --- |'
            for f in dist/dist-*; do echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      # 想留一份可下载产物就解开这段（v6+ 才是 Node 24 运行时）
      # - uses: actions/upload-artifact@v6
      #   with:
      #     name: dist
      #     path: dist/
      #     compression-level: 0
      #     retention-days: 90

      - name: Publish Release
        uses: softprops/action-gh-release@v3    # v3 = Node 24 运行时；v2.6.2 已停止维护
        with:
          tag_name: ${{ steps.meta.outputs.tag }}    # 用真实推送的 tag，不再凭 package.json 拼
          target_commitish: ${{ github.sha }}
          name: v${{ steps.meta.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            🕐 Build at: ${{ steps.meta.outputs.time }}
            🔗 Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            🏗️ Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/*
