# ==========================================
# Mihomo / Clash.Meta 覆写文件 (Override)
# 适用: Clash Verge Rev / Mihomo Party / Nyanpasu
# 功能: 强制覆写端口、代理组、规则集、DNS、嗅探等
# ==========================================

# ---------- 1. 基础端口与全局设置 ----------
mixed-port: 25480
socks-port: 25481
redir-port: 25482
tproxy-port: 25483
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true

# ---------- 2. 性能优化 ----------
tcp-concurrent: true
enable-process: true
find-process-mode: strict
keep-alive-interval: 30
keep-alive-idle: 600
unified-delay: true

# ---------- 3. 控制面板 ----------
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ./UI
external-ui-name: zashboard
external-ui-url: "https://ghfast.top/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ---------- 4. 订阅源 (覆写 providers) ----------
proxy-providers:
  yuyun:
    type: http
    url: "https://api.v1.mk/sub?target=clash&url=https%3A%2F%2Fyuyun.mhlnf.cn%2Fyuyunsvip%3Ftoken%3D3e4c4d0a543c31ead9572ff8c80c0279"
    interval: 3600
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204
      timeout: 5000
      lazy: false
    path: ./Providers/yuyun.yaml
    proxy: DIRECT
    header:
      User-Agent: ["clash-verge/v1.5.0"]
      Accept: ["*/*"]

# ---------- 5. 代理组 (29个分组，完整覆写) ----------
proxy-groups:
  - name: 节点选择
    type: select
    use:
      - yuyun
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - DIRECT

  - name: 自动选择
    type: url-test
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30
    timeout: 5000
    max-failed-times: 2

  - name: 故障转移
    type: fallback
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    max-failed-times: 2

  - name: 负载均衡
    type: load-balance
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    strategy: consistent-hashing
    max-failed-times: 2
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000

  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择

  - name: 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 漏网之鱼
