  - RULE-SET,crypto,Crypto
  
  # 国内域名和 IP
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  
  # 国际通用服务
  - RULE-SET,google,国外媒体
  - RULE-SET,proxy,国外媒体
  - RULE-SET,geolocation-!cn,国外媒体
  
  # GEOIP 兜底
  - GEOIP,CN,DIRECT,no-resolve
  
  # 最终匹配
  - MATCH,漏网之鱼

# ---------- 8. DNS 配置 (覆写 dns) ----------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    
  fallback:
    - 1.1.1.1
    - 8.8.8.8
    
  proxy-server-nameserver:
    - 223.5.5.5
    
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:geolocation-!cn":
      - 1.1.1.1
      - 8.8.8.8
    "geosite:gfw":
      - 1.1.1.1
      - 8.8.8.8
      
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ---------- 9. 流量嗅探 (覆写 sniffer) ----------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
      override-destination: true
    TLS:
      ports: [443, 8443, 2053, 2083, 2087, 2096]
    QUIC:
      ports: [443, 8443]
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false

# ---------- 10. 实验性功能与 Geo 数据库 ----------
profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  
geo-auto-update: true
geo-update-interval: 24
