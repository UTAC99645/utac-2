# ---------- 7. 路由规则 (覆写 rules) ----------
rules:
  # 本地和私有网络
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,fe80::/10,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  
  # 订阅源和关键域名直连
  - DOMAIN,api.v1.mk,DIRECT
  - DOMAIN,yuyun.mhlnf.cn,DIRECT
  - DOMAIN,ghfast.top,DIRECT
  
  # 广告拦截
  - RULE-SET,reject,全球拦截
  
  # 私有域名
  - RULE-SET,private,DIRECT
  
  # 国内 CDN
  - RULE-SET,cn-cdn,DIRECT
  
  # 微软服务 - 国内
  - RULE-SET,microsoft-cn,Microsoft-cn
  
  # 苹果服务 - 国内
  - RULE-SET,apple-cn,Apple-cn
  
  # AI 服务
  - RULE-SET,openai,AI服务
  - RULE-SET,anthropic,AI服务
  - RULE-SET,perplexity,AI服务
  
  # 流媒体 - 奈飞
  - RULE-SET,netflix,奈飞
  - RULE-SET,netflix-ip,奈飞,no-resolve
  
  # 流媒体 - YouTube
