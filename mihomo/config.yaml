# ==========================================
# Mihomo / Clash.Meta 核心配置 - 中国识别优化版
# 优化: 增强国内域名/IP识别、DNS分流精细化、Fake-IP过滤完善
# 版本: 3.7 (CN-Optimized)
# Google Play HotFix
# ==========================================

# ==== tun ====
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
    - "udp://[::]:53"
    - "tcp://[::]:53"
  auto-route: true
  auto-detect-interface: true
  auto-redirect: true             # 加这行（Android 端提升兼容性）
  strict-route: true
  inet6-address:
    - fdaa:adbf:30c8::1/64
  inet6-route-address: []

# ========== 基础端口 ==========
mixed-port: 25480
socks-port: 25481
redir-port: 25482
tproxy-port: 25483
allow-lan: false
bind-address: "*"
mode: rule
log-level: warning
ipv6: true

# ========== 性能优化 ==========
tcp-concurrent: true
enable-process: true
find-process-mode: strict
keep-alive-interval: 30
keep-alive-idle: 600
unified-delay: true

# ========== 控制面板 ==========
external-controller: 0.0.0.0:9090
secret: "99645"

external-ui: ./ui
external-ui-name: zashboard
external-ui-url: "https://ghfast.top/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 跨域（必须，否则外部浏览器连不上）
external-controller-cors:
  allow-private-network: true
  allow-origins:
    - '*'

# ========== 订阅源 ==========
proxy-providers:
  yuyun:
    type: http
    url: "https://yuyun.mhlnf.cn/yuyunsvip?token=3e4c4d0a543c31ead9572ff8c80c0279"
    interval: 3600
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204
      timeout: 5000
      lazy: false
    path: ./providers/yuyun.yaml
    proxy: DIRECT
    header:
      User-Agent: ["clash-verge/v1.5.0"]
      Accept: ["*/*"]

# ========== 代理组（29个分组 - 国外服务默认使用订阅） ==========

proxy-groups:
  # 主选择组
  - name: 节点选择
    type: select
    use:
      - yuyun
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - DIRECT

  # 自动选择
  - name: 自动选择
    type: url-test
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 30
    timeout: 5000
    max-failed-times: 2

  # 故障转移
  - name: 故障转移
    type: fallback
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    max-failed-times: 2

  # 负载均衡
  - name: 负载均衡
    type: load-balance
    use:
      - yuyun
    lazy: false
    filter: "(?i)^(?!.*(GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置|套餐|剩余|永久|网站|地址|有效|国内|客服|售后|QQ|群|联系|使用|说明|导航|超时|失败|error|timeout|官网))"
    strategy: consistent-hashing
    max-failed-times: 2
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000

  # 全球直连
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择

  # 全球拦截
