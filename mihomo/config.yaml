# ========== DNS 配置（精细化中国识别优化） ==========
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.stun.*"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "ntp.*.gov"
  use-hosts: true
  respect-rules: true
  # ... 后面保持不变


  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  nameserver-policy:
    "geosite:cn,private,geolocation-cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn,gfw":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - cn
      - private
    ipcidr:
      - 240.0.0.0/4
    # IPv6 排除：避免把 IPv6 保留地址误判为污染
    # 实际污染返回的是真实公网 IPv6（如 Facebook 的 2a03:2880::），
    # 所以 fallback-filter 主要靠 geoip 判断

hosts:
  'cloudflare-dns.com': [104.16.249.249, 2606:4700::6810:f9f9]
  'dns.google': [8.8.4.4, 2001:4860:4860::8844]
  'dns.alidns.com': [223.5.5.5, 2400:3200::1]
  'doh.pub': [1.12.12.12, 2402:4e00::]
  'one.one.one.one': [1.1.1.1, 2606:4700:4700::1111]


# ========== 流量嗅探 ==========
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
      override-destination: true
    TLS:
      ports: [443, 8443, 2053, 2083, 2087, 2096]
    QUIC:
      ports: [443, 8443]
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false

# ========== 实验性功能 ==========
profile:
  store-selected: true
  store-fake-ip: true
  
# ========== 精简版数据库 ==========
geox-url:
  geoip: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  
geo-auto-update: true
geo-update-interval: 24
